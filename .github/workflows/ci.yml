name: CI

on:
    push:
        branches: [main]
    pull_request:

# A newer push to a pull request replaces its run; every commit on main finishes, so each one has a result.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            # Production dependencies only: dev tooling never ships. High and critical advisories fail the build.
            - run: npm audit --omit=dev --audit-level=high
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run test:coverage
            - name: Coverage summary
              if: always()
              run: |
                  node -e '
                  const t = require("./coverage/coverage-summary.json").total;
                  const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
                  console.log(["## Coverage", "| | % | covered |", "|---|---|---|", ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
                  ' >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: coverage
                  path: coverage/
                  retention-days: 14

    docker:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: docker build -f docker/Dockerfile -t trading-bot:ci .
            - name: Native SQLite loads as the non-root user
              run: docker run --rm trading-bot:ci node -e "const D = require('better-sqlite3'); new D(':memory:').prepare('select 1').get()"
            - name: Fails fast with a readable config error
              run: |
                  if docker run --rm trading-bot:ci > out.txt 2>&1; then exit 1; fi
                  grep -q "Invalid configuration" out.txt
            - name: Health check reports unhealthy without a heartbeat
              run: "! docker run --rm trading-bot:ci node dist/healthcheck.js"
