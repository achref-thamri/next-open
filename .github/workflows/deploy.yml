name: Deploy

# Ships main to the server after CI passes on it. The deploy key may only run scripts/server-deploy.sh there.
on:
    workflow_run:
        workflows: [CI]
        branches: [main]
        types: [completed]
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        # A manual run deploys main only; automatic runs follow a green CI run on a push to main.
        if: >-
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
            (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        environment: production
        timeout-minutes: 110
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - name: Set up SSH
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
            - name: Deploy
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
              # The server exits 75 around the open and the post-close jobs (the longer window is 90 minutes) and while
              # another deploy runs. Wait that out rather than fail and leave main undeployed.
              run: |
                  for _ in $(seq 1 20); do
                      status=0
                      git archive --format=tar HEAD | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "bot@$DEPLOY_HOST" || status=$?
                      [[ $status -eq 75 ]] || exit "$status"
                      echo "server refused for now; trying again in 5 minutes"
                      sleep 300
                  done
                  echo "server still refusing after 100 minutes" >&2
                  exit 75
