name: Deploy

# Ships main to the server after CI passes on it. The deploy key may only run scripts/server-deploy.sh there.
on:
    workflow_run:
        workflows: [CI]
        branches: [main]
        types: [completed]
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    deploy:
        if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        environment: production
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - name: Set up SSH
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
            - name: Deploy
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
              run: git archive --format=tar HEAD | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "bot@$DEPLOY_HOST"
