version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: saturday
      open-pull-requests-limit: 5
      groups:
          # Linting, types and test tooling move together; one PR a week instead of many.
          dev-tooling:
              dependency-type: development
              update-types: [minor, patch]
          runtime:
              dependency-type: production
              update-types: [minor, patch]
      ignore:
          # Node types follow the runtime in .nvmrc (24), not the newest Node.
          - dependency-name: "@types/node"
            update-types: [version-update:semver-major]
          # Majors wait until typescript-eslint supports them; take them by hand.
          - dependency-name: typescript
            update-types: [version-update:semver-major]
    # Actions are pinned to commit SHAs; Dependabot moves the SHA and the version comment together.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: saturday
    - package-ecosystem: docker
      directory: /docker
      schedule:
          interval: weekly
          day: saturday
      ignore:
          # Stay on the Node LTS line from .nvmrc; moving to the next LTS is a deliberate change.
          - dependency-name: node
            update-types: [version-update:semver-major]
