name: next-open

services:
    next-open:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: next-open:latest
        restart: unless-stopped
        env_file: .env
        environment:
            DATABASE_PATH: /data/next-open.db
            HEARTBEAT_PATH: /data/heartbeat
            BACKUP_DIR: /data/backups
        volumes:
            - data:/data
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: "5"

volumes:
    data:
