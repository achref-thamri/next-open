name: next-open

services:
    next-open:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: next-open:latest
        restart: unless-stopped
        # Docker's default 10 s would kill a running job (such as the open) mid-way on a restart or reboot;
        # shutdown waits for it. Keep this above SHUTDOWN_LIMIT_MS in src/main.ts.
        stop_grace_period: 2m
        env_file: .env
        environment:
            DATABASE_PATH: /data/next-open.db
            HEARTBEAT_PATH: /data/heartbeat
            BACKUP_DIR: /data/backups
        volumes:
            - data:/data
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: "5"

volumes:
    data:
